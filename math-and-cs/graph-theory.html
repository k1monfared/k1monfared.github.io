	<!-- Apply saved theme immediately to prevent flash -->
	<script>
		(function() {
			function getCookie(name) {
				const value = `; ${document.cookie}`;
				const parts = value.split(`; ${name}=`);
				if (parts.length === 2) return parts.pop().split(';').shift();
				return null;
			}
			let theme = getCookie('theme');
			if (!theme) {
				try { theme = localStorage.getItem('theme'); } catch (e) {}
			}
			theme = theme || 'dark';
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>

				<h2>Graph Theory & Combinatorics</h2>
				<p class="domain-intro">
					Work on permanent ranks, cycle analysis, matching problems, and spectral characterizations of graph properties.
				</p>

				<div class="section-block">
					<h3>Papers</h3>
					<ul id="gt-papers"></ul>
				</div>
				<script>
					renderPapers('gt-papers', [
						{
							title: 'On the principal permanent rank characteristic sequences of graphs and digraphs',
							url: 'http://dx.doi.org/10.13001/1081-3810.3117',
							tag: 'EJLA 2016',
							pdfUrl: '../research/2016_On_the_principal_permanent_rank_characteristic_sequences_of_graphs_and_digraphs.pdf',
							arxivUrl: 'https://arxiv.org/abs/1510.05153',
							thumb: '../research/2016_On_the_principal_permanent_rank_characteristic_sequences_of_graphs_and_digraphs.webp',
							authors: 'K. Hassani Monfared, P. Horn, F.H.J. Kenter, K. Nowak, J. Sinkovic, J. Tobin.',
							abstract: 'A characterization of all principal permanent rank sequences obtainable by nonnegative matrices and nonnegative symmetric matrices. Constructions for all realizable sequences are provided, with results for skew-symmetric matrices also included.',
							takeaways: '<b>Problem:</b> Which binary sequences are realizable as the principal permanent rank characteristic sequence of a matrix, where each bit indicates whether some principal submatrix of that size has nonzero permanent?<br><b>Key result:</b> Complete characterizations for nonneg. matrices, nonneg. symmetric matrices, and skew-symmetric tree matrices, with explicit constructions for every realizable sequence.<br><b>Method:</b> Exploiting the duality between permanents and generalized cycles, reducing the matrix question to combinatorial conditions on matchings and cycle structures.'
						},
						{
							title: 'Spectral characterization of matchings in graphs',
							url: 'http://dx.doi.org/10.1016/j.laa.2016.02.004',
							tag: 'LAA 2016',
							pdfUrl: '../research/2016_Spectral_characterization_of_matchings_in_graphs.pdf',
							arxivUrl: 'https://arxiv.org/abs/1602.03590',
							thumb: '../research/2016_Spectral_characterization_of_matchings_in_graphs.webp',
							authors: 'K. Hassani Monfared, S. Mallik.',
							abstract: 'A spectral characterization of the matching number of a graph: graphs of order \\(n\\) with matching number \\(k\\) are precisely those with maximum skew rank \\(2k\\) such that for any \\(k\\) distinct nonzero purely imaginary numbers there is a real skew-symmetric matrix with that graph and spectrum.',
							takeaways: '<b>Problem:</b> Can the matching number of a graph be characterized purely through eigenvalues of associated skew-symmetric matrices?<br><b>Key result:</b> A connected graph has matching number \\(k\\) iff its maximum skew rank is \\(2k\\), and for any \\(k\\) distinct nonzero purely imaginary numbers the corresponding skew-symmetric matrix with that graph and spectrum exists.<br><b>Method:</b> Characterization of NEB (nearly even branching) trees and spanning tree arguments combined with the Jacobian method.'
						},
						{
							title: 'Construction of real skew-symmetric matrices from interlaced spectral data, and graph',
							url: 'http://dx.doi.org/10.1016/j.laa.2015.01.001',
							tag: 'LAA 2015',
							pdfUrl: '../research/2015_Construction_of_real_skew-symmetric_matrices_from_interlaced_spectral_data,_and_graph.pdf',
							arxivUrl: 'https://arxiv.org/abs/1412.6085',
							thumb: '../research/2015_Construction_of_real_skew-symmetric_matrices_from_interlaced_spectral_data,_and_graph.webp',
							authors: 'K. Hassani Monfared, S. Mallik.',
							abstract: 'Analogues of the Duarte/Jacobian method results are presented for real skew-symmetric matrices whose graphs belong to a certain family of trees and all of their supergraphs, constructing matrices with prescribed interlaced spectral data.',
							takeaways: '<b>Problem:</b> Can the structured inverse eigenvalue problem with interlacing data be solved for real skew-symmetric matrices (not just symmetric)?<br><b>Key result:</b> For trees with the nearly even branching (NEB) property and all their supergraphs, the skew-symmetric SIEP with interlacing data has a solution.<br><b>Method:</b> Analysis of characteristic polynomials of skew-symmetric matrices on trees, nonsingularity of the Jacobian at matrices with the Duarte property, and the Implicit Function Theorem for extension to supergraphs.'
						},
						{ title: 'Properties of a nonneg. reciprocal matrix and application to AHP', tag: 'Not Published', thumb: '../images/thumbs/paper-reciprocal.webp' },
						{ title: 'Dissonance networks and social influence', tag: 'Not Published', thumb: '../images/thumbs/paper-dissonance.webp' }
					]);
				</script>

	<button class="scroll-to-top" aria-label="Scroll to top"></button>
	<script>
		const scrollToTopBtn = document.querySelector('.scroll-to-top');
		if (scrollToTopBtn) {
			scrollToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
			window.addEventListener('scroll', () => {
				scrollToTopBtn.style.opacity = window.pageYOffset > 300 ? '1' : '0';
				scrollToTopBtn.style.pointerEvents = window.pageYOffset > 300 ? 'auto' : 'none';
