<!DOCTYPE html>
<html lang="en">

<head>
	<script>
		(function() {
			function getCookie(name) {
				const value = `; ${document.cookie}`;
				const parts = value.split(`; ${name}=`);
				if (parts.length === 2) return parts.pop().split(';').shift();
				return null;
			}
			let theme = getCookie('theme');
			if (!theme) {
				try { theme = localStorage.getItem('theme'); } catch (e) {}
			}
			theme = theme || 'dark';
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="../css/mainCSS.css" />
	<link rel="stylesheet" type="text/css" href="../css/otherStyles.css" />
	<title>Keivan Monfared</title>
	<script type="text/javascript" src="../js/nav-loader.js"></script>
	<script type="text/javascript" src="../js/theme-toggle.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
	<div class="bg-gradient"></div>

	<header class="site-header"></header>

	<div id="stick-here"></div>
	<div id="nav-container"></div>

	<div class="container">
		<script type="text/javascript">
			window.addEventListener('navigationLoaded', function() {
				var topic = new URLSearchParams(window.location.search).get('topic') || '';
				var items = [
					{ name: 'music', label: 'music' },
					{ name: 'calligraphy', label: 'calligraphy' },
					{ name: 'woodworking', label: 'woodworking' },
					{ name: 'photography', label: 'photography' },
					{ name: 'learning', label: 'learning' }
				];
				var html = '';
				items.forEach(function(item) {
					var href = item.name === 'learning' ? '../learning.html' : 'page.html?topic=' + item.name;
					var cls = item.name === topic ? ' class="sub-active"' : '';
					html += '<a href="' + href + '"' + cls + '>' + item.label + '</a>';
				});
				document.getElementById('small_menu').innerHTML = html;
			});
		</script>

		<main class="main-content">
			<div id="md-content" class="domain-section"></div>
		</main>

		<footer class="site-footer">
			<div id="footer-container"></div>
		</footer>
	</div>

	<button class="scroll-to-top" aria-label="Scroll to top"></button>

	<script>
		(function() {
			var params = new URLSearchParams(window.location.search);
			var topic = params.get('topic');
			if (!topic) {
				window.location.href = '../interests.html';
				return;
			}

			// Set page title
			document.title = 'Keivan Monfared - ' + topic.charAt(0).toUpperCase() + topic.slice(1);

			// Fetch and render markdown
			fetch(topic + '.md')
				.then(function(r) {
					if (!r.ok) throw new Error('Not found');
					return r.text();
				})
				.then(function(md) {
					document.getElementById('md-content').innerHTML = marked.parse(md);
				})
				.catch(function() {
					document.getElementById('md-content').innerHTML =
						'<p>Page not found. <a href="../interests.html">Back to interests</a>.</p>';
				});
		})();

		// Scroll to top
		var scrollToTopBtn = document.querySelector('.scroll-to-top');
		if (scrollToTopBtn) {
			scrollToTopBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
			window.addEventListener('scroll', function() {
				scrollToTopBtn.style.opacity = window.pageYOffset > 300 ? '1' : '0';
				scrollToTopBtn.style.pointerEvents = window.pageYOffset > 300 ? 'auto' : 'none';
			});
			scrollToTopBtn.style.opacity = '0';
			scrollToTopBtn.style.pointerEvents = 'none';
		}
	</script>
</body>

</html>
